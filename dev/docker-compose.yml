# TenderRadar — full stack
#   nginx (:80)  ->  frontend (React/nginx)  +  backend (FastAPI)
#   scheduler    ->  APScheduler worker (scraping, digests, reports, archiver)
#   db           ->  PostgreSQL 16 (full-text search)
#   redis        ->  Redis 7 (page cache, scrape locks)
#
# Usage:  cp .env.example .env   &&   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderradar}
      POSTGRES_DB: ${POSTGRES_DB:-tenderradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        # INSTALL_BROWSER=true (default) installs the libs Chromium needs at
        # build and downloads the browser into the 'browsers' volume at first
        # run — required for the JS-gated portals (NIC eProcurement, GeM).
        # Set false for a slim demo-only image.
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tenderradar}:${POSTGRES_PASSWORD:-tenderradar}@db:5432/${POSTGRES_DB:-tenderradar}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost
      SCHEDULER_ENABLED: "false"   # the dedicated scheduler service owns jobs
      PLAYWRIGHT_BROWSERS_PATH: /browsers
      INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    volumes:
      - storage:/app/storage
      - browsers:/browsers
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Seed runs WITHOUT --scrape so the API comes up fast; the scheduler service
    # owns scraping (it kicks the first run ~30s after start, then hourly).
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  scheduler:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tenderradar}:${POSTGRES_PASSWORD:-tenderradar}@db:5432/${POSTGRES_DB:-tenderradar}
      REDIS_URL: redis://redis:6379/0
      PLAYWRIGHT_BROWSERS_PATH: /browsers
      INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    volumes:
      - storage:/app/storage
      - browsers:/browsers
    depends_on:
      backend:
        condition: service_started
    command: python -m app.scheduler

  frontend:
    restart: unless-stopped
    build: ./frontend

  nginx:
    # restart covers the startup race: if nginx comes up before the backend's
    # DNS name resolves, it exits once and recovers on the next start.
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  storage:
  browsers:        # stealth Chromium, downloaded once at runtime (kept out of the image)
